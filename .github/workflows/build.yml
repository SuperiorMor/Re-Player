name: Build Re:Player Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle 8.10
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10.2'

    - name: Build Debug APK
      run: |
        gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log || {
          echo "==================== BUILD FAILED ===================="
          grep -C 3 -E "e: |error:|FAILED|FAILURE" build.log || tail -n 80 build.log
          echo "======================================================"
          exit 1
        }

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RePlayer-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 14

    - name: Upload Build Log on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-failure-log
        path: build.log
